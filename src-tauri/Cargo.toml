[package]
name = "memeit"
version = "0.1.2"
description = "A keyboard-first meme palette for your conversations"
authors = ["MemeIT contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "memeit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3.7", features = ["wayland-data-control"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.17"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
open = "5"
candle-core = { version = "=0.11.1", default-features = false }
candle-nn = { version = "=0.11.1", default-features = false }
candle-transformers = { version = "=0.11.1", default-features = false }
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
rust-stemmers = "1.2"
sha2 = "0.10"
